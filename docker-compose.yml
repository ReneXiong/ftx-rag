services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER:-ftxrag}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ftxrag_dev}  # local development only
      POSTGRES_DB: ${PG_DATABASE:-ftxrag}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
