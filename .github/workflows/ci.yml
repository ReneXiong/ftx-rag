name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
      # The unit tests import only the light modules, so CI skips the
      # torch / Docling / sentence-transformers stack.
      - run: uv pip install numpy httpx python-dotenv lightrag-hku typer rich pytest ruff
      - run: ruff check .
      - run: pytest -q
